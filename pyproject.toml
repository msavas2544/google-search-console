[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "google-search-console"
dynamic = ["version"]
description = "Python client for the Google Search Console API: Search Analytics without the 25k-row limit, URL Inspection, sitemaps, sync & async, CLI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Orcai LLC" }]
keywords = ["google search console", "search console api", "seo", "search analytics", "url inspection", "sitemaps", "webmasters"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
  "Framework :: AsyncIO",
]
dependencies = ["httpx>=0.24,<1", "tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
google-auth = ["google-auth>=2.20", "requests>=2"]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "ruff", "mypy"]

[project.scripts]
gsc = "google_search_console.cli:main"

[project.urls]
Homepage = "https://github.com/msavas2544/google-search-console"
Repository = "https://github.com/msavas2544/google-search-console"
Issues = "https://github.com/msavas2544/google-search-console/issues"
Changelog = "https://github.com/msavas2544/google-search-console/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/google_search_console/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/google_search_console"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045", "B008"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = false
warn_return_any = false
